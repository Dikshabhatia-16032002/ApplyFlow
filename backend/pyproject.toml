[project]
name = "outreach"
version = "0.1.0"
description = "Automated job outreach"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
